name: Extension syntax
on: [push, pull_request]
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --check CleanUI/index.js
      - run: python -m json.tool CleanUI/manifest.json
      - run: python -m json.tool examples/roleplay-character.json
